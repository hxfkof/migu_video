name: Sync Fork (Safe Update)

on:
  schedule:
    - cron: '0 18 * * *'  # 每天 UTC 18:00 = 北京时间 02:00
  workflow_dispatch:        # 支持手动触发同步

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout fork repository
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ 配置 Git
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      # 3️⃣ 添加上游仓库
      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/hxfkofhotmail/migu_video.git || echo "upstream exists"
          git fetch upstream

      # 4️⃣ 合并上游 main 分支到 fork main
      - name: Merge upstream main
        run: |
          git checkout main
          git merge upstream/main --no-edit || echo "Already up to date"

      # 5️⃣ 推送到 fork
      - name: Push to fork
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin main
          echo "✅ Fork updated successfully"
